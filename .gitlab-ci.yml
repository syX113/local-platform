stages:
  - ingestion
  - dbt

workflow:
  name: Local Platform Promotion
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - when: never

promote_ingestion_pipeline:
  stage: ingestion
  trigger:
    include:
      - local: .gitlab/ci/ingestion-promotion.yml
    strategy: depend

promote_dbt_pipeline:
  stage: dbt
  needs:
    - promote_ingestion_pipeline
  trigger:
    include:
      - local: .gitlab/ci/dbt-promotion.yml
    strategy: depend
