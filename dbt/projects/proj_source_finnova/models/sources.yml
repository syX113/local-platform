version: 2

sources:
  - name: source_sdp_orders_inbound
    database: "{{ env_var('SNOWFLAKE_SDP_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SDP_IN_SCHEMA', 'INBOUND') }}"
    tables:
      - name: EXT_ORDERS_RAW
      - name: EXT_ORDER_ITEMS_RAW
  - name: source_sdp_customers_inbound
    database: "{{ env_var('SNOWFLAKE_SDP_CUSTOMERS_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SDP_IN_SCHEMA', 'INBOUND') }}"
    tables:
      - name: EXT_CUSTOMERS_RAW
  - name: source_sdp_taxes_inbound
    database: "{{ env_var('SNOWFLAKE_SDP_TAXES_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SDP_IN_SCHEMA', 'INBOUND') }}"
    tables:
      - name: EXT_TAXES_RAW
  - name: source_sdp_depot_transactions_inbound
    database: "{{ env_var('SNOWFLAKE_SDP_DEPOT_TRANSACTIONS_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SDP_IN_SCHEMA', 'INBOUND') }}"
    tables:
      - name: EXT_DEPOT_TRANSACTIONS_RAW

models:
  - name: model_sdp_orders_core_orders_clean
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_total
        tests:
          - not_null
  - name: model_sdp_orders_core_order_items_clean
    columns:
      - name: order_id
        tests:
          - not_null
      - name: item_id
        tests:
          - not_null
  - name: model_sdp_orders_core_customer_order_summary
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
  - name: model_sdp_customers_core_customers_clean
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: total_order_value
        tests:
          - not_null
  - name: model_sdp_customers_core_customer_region_summary
    columns:
      - name: region
        tests:
          - not_null
          - unique
  - name: model_sdp_customers_core_customer_segment_summary
    columns:
      - name: segment
        tests:
          - not_null
          - unique
  - name: model_sdp_taxes_core_taxes_clean
    columns:
      - name: tax_code
        tests:
          - not_null
          - unique
      - name: rate
        tests:
          - not_null
  - name: model_sdp_taxes_access_taxes_grain
    columns:
      - name: tax_code
        tests:
          - not_null
          - unique
  - name: model_sdp_depot_transactions_core_transactions_clean
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: amount
        tests:
          - not_null
  - name: model_sdp_depot_transactions_access_transactions_grain
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
