name: local_platform
version: 1.0.0
config-version: 2
profile: local_platform

model-paths: ["models"]
seed-paths: ["seeds"]
clean-targets:
  - target
  - dbt_packages

models:
  local_platform:
    sdp:
      +database: "{{ env_var('SNOWFLAKE_SDP_DATABASE') }}"
      +schema: "{{ env_var('SNOWFLAKE_SDP_CORE_SCHEMA', 'CORE') }}"
      core:
        +materialized: table
      access:
        +schema: "{{ env_var('SNOWFLAKE_SDP_ACC_SCHEMA', 'ACCESS') }}"
        +materialized: table
    edp:
      inbound:
        +database: "{{ env_var('SNOWFLAKE_EDP_DATABASE') }}"
        +schema: "{{ env_var('SNOWFLAKE_EDP_IN_SCHEMA', 'INBOUND') }}"
        +materialized: view
      core:
        +database: "{{ env_var('SNOWFLAKE_EDP_DATABASE') }}"
        +schema: "{{ env_var('SNOWFLAKE_EDP_CORE_SCHEMA', 'CORE') }}"
        +materialized: table
      access:
        +database: "{{ env_var('SNOWFLAKE_EDP_DATABASE') }}"
        +schema: "{{ env_var('SNOWFLAKE_EDP_ACC_SCHEMA', 'ACCESS') }}"
        +materialized: table
