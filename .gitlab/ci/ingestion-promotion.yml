include:
  - local: .gitlab/ci/common.yml

workflow:
  name: Ingestion Promotion

stages:
  - build
  - validate
  - promote
  - mock_cd

build_ingestion_runtimes:
  stage: build
  script:
    - docker compose build airflow-webserver dlt-extractor

validate_ingestion_assets:
  stage: validate
  script:
    - docker compose config -q
    - docker compose run --rm --no-deps airflow-webserver python -m compileall /opt/airflow/dags
    - docker compose run --rm --no-deps dlt-extractor python -m compileall /opt/platform/dlt /opt/platform/scripts

promote_ingestion:
  stage: promote
  script:
    - ./scripts/verify-ingestion-promotion.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ingestion/

mock_cd_ingestion:
  stage: mock_cd
  needs:
    - promote_ingestion
  script:
    - mkdir -p artifacts/ingestion
    - printf 'mock_cd=ingestion\nstatus=skipped_real_deploy\nreason=no_second_environment\n' > artifacts/ingestion/mock_cd.txt
    - cat artifacts/ingestion/mock_cd.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ingestion/mock_cd.txt
